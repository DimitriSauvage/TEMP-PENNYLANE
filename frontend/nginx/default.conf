server {
    # 8080: the unprivileged nginx image cannot bind ports <1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. `always` keeps them on error responses (404/502...).
    # CSP baseline: style-src needs 'unsafe-inline' because the PrimeVue
    # runtime theme injects inline <style> tags; script-src needs it because
    # the Nuxt-generated SPA shell ships build-dependent inline scripts
    # (importmap, __NUXT__ config, JSON payload) — hash-pinning them would
    # break on every rebuild. External scripts/images stay origin-restricted.
    # Recipe images come from external https URLs.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'" always;

    # SPA fallback: client-side routing needs unknown paths to serve the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed, immutable build assets: safe to cache for a year.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header inheritance: a location that adds its own header loses
        # the server-level ones, so re-declare the security headers here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'" always;
    }

    # Never cache the SPA shell: a redeploy must be picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'" always;
    }

    # Same-origin API: the SPA is built with an empty apiBase, so browser
    # calls hit this nginx and are proxied to the backend service.
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Compress JS/CSS/JSON (the stock image ships gzip off in nginx.conf,
    # and its default gzip_types would be text/html only).
    gzip on;
    gzip_types application/javascript text/css application/json;
    gzip_min_length 1024;
}
